name: 构建 APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        timeout-minutes: 20

      - name: 接受许可并安装平台/构建工具
        timeout-minutes: 25
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | sdkmanager --licenses
          for i in 1 2 3; do
            sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" && break
            echo "sdkmanager 第 $i 次失败，重试…"; sleep 15
          done

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 编译 Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK 产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magicbeauty-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: 打印 APK 路径
        if: success()
        run: find app/build/outputs/apk/debug -name "*.apk" -exec ls -lh {} \;
