name: 构建 APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # 允许自动创建/更新 Release

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 Android SDK 组件
        timeout-minutes: 25
        run: |
          set -e
          SDK=/usr/local/lib/android/sdk
          # 优先使用 runner 预装的 sdkmanager
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            SM=$(ls "$SDK/cmdline-tools"/*/bin/sdkmanager 2>/dev/null | head -1)
          fi
          # 预装缺失时自行下载 command-line tools
          if [ -z "$SM" ] || [ ! -x "$SM" ]; then
            echo "预装 sdkmanager 未找到，自行下载 command-line tools ..."
            mkdir -p /tmp/ct && cd /tmp/ct
            curl --retry 3 --connect-timeout 30 -fsSL -o ct.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q ct.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "使用 sdkmanager: $SM"
          export ANDROID_SDK_ROOT=$SDK
          export ANDROID_HOME=$SDK
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$SM" --licenses >/dev/null
          "$SM" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 下载人体解析模型（LIP 20 类，约 68MB）
        timeout-minutes: 20
        run: |
          set -e
          mkdir -p app/src/main/assets
          OUT=app/src/main/assets/human_parsing.onnx
          if [ -f "$OUT" ] && [ "$(stat -c%s "$OUT")" -gt 50000000 ]; then
            echo "模型已存在，跳过下载"
          else
            for i in 1 2 3; do
              echo "第 $i 次尝试下载 ..."
              if curl -L --retry 3 --retry-delay 5 --connect-timeout 40 --max-time 1200 \
                "https://hf-mirror.com/pirocheto/schp-lip-20/resolve/main/onnx/schp-lip-20-int8-static.onnx" \
                -o "$OUT"; then
                break
              fi
              sleep 5
            done
          fi
          ls -lh "$OUT"
          test "$(stat -c%s "$OUT")" -gt 50000000

      - name: 编译 Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK 产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magicbeauty-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: 读取版本号
        if: success()
        id: ver
        run: echo "V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      # 构建成功即自动发布/更新同名 Release，手机浏览器收藏
      # releases/latest 页面即可永远拿到最新 APK（替代 artifact 90 天失效+需解压）
      - name: 发布到 GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.V }}
          name: MagicBeauty v${{ steps.ver.outputs.V }}
          body: |
            自动构建发布。更新内容见 git log。
            手机浏览器直接下载本页面的 APK 安装即可（约 137MB，首次打开需加载人体解析模型）。
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true

      - name: 打印 APK 路径
        if: success()
        run: find app/build/outputs/apk/debug -name "*.apk" -exec ls -lh {} \;
